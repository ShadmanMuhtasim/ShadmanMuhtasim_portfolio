name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # =========================================================================
  # Phase 1: CI — Quality & Build Gate
  # =========================================================================
  ci:
    name: CI - Quality & Build Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Linting
        run: npm run lint --if-present

      - name: Type Checking (tsc -b)
        run: npx tsc -b

      - name: Run Test Suite
        run: npm test --if-present

      - name: Compile Production Bundle (Vite)
        run: npm run build

      - name: Upload Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  # =========================================================================
  # Phase 2: CD — Automated Netlify Production Deployment
  # =========================================================================
  cd:
    name: CD - Netlify Production Deploy
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Production Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist

      - name: Deploy to Netlify Production
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN secret is missing! Please configure it in GitHub Repository Secrets."
            exit 1
          fi
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_SITE_ID secret is missing! Please configure it in GitHub Repository Secrets."
            exit 1
          fi

          echo "🚀 Deploying 'dist/' directly to Netlify production..."
          DEPLOY_OUTPUT=$(npx --yes netlify-cli@latest deploy \
            --prod \
            --dir=dist \
            --message="GitHub Actions CI/CD Deploy (${{ github.sha }})")
          
          echo "$DEPLOY_OUTPUT"

          # Extract URLs from netlify-cli output
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -iE 'Website URL:|Website Draft URL:' | awk '{print $NF}' | head -n 1)
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.netlify\.app' | head -n 1 || echo "")
          fi

          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Publish Deployment Summary
        if: always()
        run: |
          echo "### 🚀 Netlify Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status == 'success' && '✅ Succeeded' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered By** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.deploy.outputs.deploy_url }}" ]; then
            echo "| **Live Site** | [${{ steps.deploy.outputs.deploy_url }}](${{ steps.deploy.outputs.deploy_url }}) |" >> $GITHUB_STEP_SUMMARY
          fi
