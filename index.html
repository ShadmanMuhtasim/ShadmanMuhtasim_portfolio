<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shadman Muhtasim | Software Engineer (.NET & AI Applications)</title>
    <meta name="description" content="Portfolio of Shadman Muhtasim - Software Engineer specializing in ASP.NET Core, .NET 8, React/TypeScript, and practical AI/LLM application engineering." />
    <meta name="keywords" content="Shadman Muhtasim, Software Engineer, ASP.NET Core, .NET Developer, React, TypeScript, Full-Stack, AI Engineering, Dhaka" />
    <meta name="author" content="Shadman Muhtasim" />

    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shadman Muhtasim | Software Engineer (.NET & AI Applications)" />
    <meta property="og:description" content="Software Engineer — Backend & Full-Stack Developer with strong ASP.NET Core / .NET foundation and practical AI/LLM application engineering experience." />

    <!-- Preconnect & Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <script>
      // Early dark-mode initialization to prevent flash
      try {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-darkbg text-slate-800 dark:text-zinc-300 font-sans antialiased selection:bg-sky-500/20 selection:text-sky-300 transition-colors duration-200 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
