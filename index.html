    <script>
      (() => {
        let saved = null;
        try { saved = localStorage.getItem('theme'); } catch { saved = null; }
        const light = saved === 'light' || (saved !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches);
        const root = document.documentElement;
        root.classList.toggle('dark', !light);
        root.classList.replace('no-js', 'js');
        const navigation = performance.getEntriesByType('navigation')[0];
        if (navigation?.type === 'navigate' && !matchMedia('(prefers-reduced-motion: reduce)').matches) root.dataset.entry = 'true';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
